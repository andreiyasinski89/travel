<!-- STEPS: scroll route -->
<section class="bg-mint-grad px-4 py-20 sm:px-6 lg:py-28">
  <div class="mx-auto max-w-4xl">
    <div data-route class="relative">
      <div class="absolute left-5 top-0 h-full w-10 -translate-x-1/2 md:left-1/2" aria-hidden="true">
        <svg viewBox="0 0 10 100" preserveAspectRatio="none" class="absolute inset-0 h-full w-full">

          <path class="route-fill" d="M5,0 L5,100" fill="none" stroke="#0B3C5D" stroke-width="5" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="route-plane absolute z-10 h-8 w-20 -translate-x-1/2 -translate-y-1/2"><div class="h-full w-full drop-shadow-lg"><span data-art="plane"></span></div></div>
      </div>
      <ol id="stepList" class="space-y-14 py-6"></ol>
    </div>
  </div>
</section>

<!-- AI CHAT -->
<section class="relative overflow-hidden bg-ocean-grad px-4 py-20 text-pale sm:px-6 lg:py-28">
  <div class="pointer-events-none absolute inset-0" aria-hidden="true"><span class="a-twinkle absolute left-[8%] top-[20%] h-1.5 w-1.5 rounded-full bg-gold"></span><span class="a-twinkle absolute left-[60%] top-[12%] h-1.5 w-1.5 rounded-full bg-pale" style="--dl:-1s"></span><span class="a-twinkle absolute left-[90%] top-[55%] h-1.5 w-1.5 rounded-full bg-gold" style="--dl:-2s"></span></div>
  <div class="relative mx-auto grid max-w-6xl items-center gap-12 lg:grid-cols-2">
    <div class="reveal-left">
      <p class="text-sm font-semibold uppercase tracking-widest text-gold">AI 助手</p>
      <h2 class="mt-3 text-2xl font-bold text-gold sm:text-4xl">几分钟搞定路线</h2>
      <p class="mt-5 text-lg">告诉我们你梦想的旅行。助手会综合日期、预算和兴趣给出方案，俱乐部顾问则帮你把选定的方案落实到预订。</p>
      <ul class="mt-6 space-y-2 text-sm"><li>• 按心情挑选目的地</li><li>• 在一个地方对比酒店和机票</li><li>• 城市游览和一日游的创意</li></ul>
    </div>
    <div class="reveal-right rounded-3xl bg-deep p-5 shadow-soft ring-1 ring-pale/20 sm:p-6">
      <div class="mb-4 flex items-center gap-3"><span class="h-9 w-9"><span data-art="compass"></span></span><div><p class="font-semibold text-gold">俱乐部助手</p><p class="flex items-center gap-1 text-xs"><span class="h-2 w-2 rounded-full bg-emerald a-twinkle"></span>在线</p></div></div>
      <div id="chat" class="min-h-[260px] space-y-3 text-sm"></div>
    </div>
  </div>
</section>

<!-- FAQ -->
<section class="bg-sunset px-4 py-20 sm:px-6 lg:py-28">
  <div class="mx-auto max-w-3xl">
    <h2 class="reveal text-center text-2xl font-bold text-ocean sm:text-4xl">常见问题</h2>

<section class="relative overflow-hidden bg-azure-grad px-4 py-24 text-center sm:px-6">

    <h2 class="reveal text-2xl font-bold text-ocean sm:text-4xl">准备好迈出第一步了吗？</h2>
    <a href="https://www.mwrlife.com/ayasinski/join" target="_blank" rel="noopener noreferrer" class="reveal mt-8 inline-flex min-h-[52px] items-center rounded-full bg-gold px-10 py-3 font-semibold text-ocean shadow-gold transition hover:-translate-y-0.5 hover:bg-gold-dark" style="--d:100ms">加入俱乐部</a>
  </div>

<div id="site-footer"></div>

<script>
  const steps = [
    ['提交申请', '填写一份简短的表格。俱乐部顾问会联系你，与你相识并介绍会员方案。'],
    ['选择方案', '根据你的目标和预算选择会员方案。你的投入会转化为用于支付旅行的积分。'],
    ['打开目录', '以俱乐部价格获得酒店、机票、邮轮、租车和活动门票的访问权限。'],
    ['规划路线', 'AI 助手和顾问帮你设计行程。你对比方案，选出最好的。'],
    ['出发旅行', '预订，出发。24/7 支持就在身边，每次旅行还能获得积分用于下一次。']
  ];
  document.getElementById('stepList').innerHTML = steps.map(([t, d], i) => `
    <li class="relative grid items-start md:grid-cols-2 md:gap-16">
      <div class="reveal ${i % 2 ? 'md:col-start-2' : 'md:text-right'} ml-14 md:ml-0">
        <div class="rounded-3xl bg-ocean p-6 text-pale shadow-soft"><span class="font-display text-3xl font-bold text-gold">0${i + 1}</span><h3 class="mt-2 text-lg font-semibold text-gold">${t}</h3><p class="mt-2 text-sm">${d}</p></div>
      </div>
    </li>`).join('');

  const script = [
    ['u', '我想十月去温暖的海边玩 7 天，两个人预算最多 1,500 美元'],
    ['b', '很棒的需求！我挑出了 3 个方案：克里特岛、特内里费岛和阿尔加维。十月那里气温都在 +24° 左右。'],
    ['u', '说说克里特岛吧'],
    ['b', '克里特岛：海边酒店、直飞航班、丰富的游览项目。要我规划路线并展示俱乐部价格吗？']
  ];
  const chat = document.getElementById('chat');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let started = false;
  function play() {
    if (started) return; started = true;
    let i = 0;
    (function next() {
      if (i >= script.length) { setTimeout(() => { chat.innerHTML = ''; started = false; play(); }, 6000); return; }
      const [w, txt] = script[i++];
      const el = document.createElement('p');
      el.className = w === 'u' ? 'ml-auto w-fit max-w-[85%] rounded-2xl rounded-br-sm bg-gold px-4 py-2 text-ocean' : 'w-fit max-w-[90%] rounded-2xl rounded-bl-sm bg-ocean px-4 py-2 text-pale';
      chat.appendChild(el);
      if (reduce) { el.textContent = txt; return next(); }
      let c = 0; el.classList.add('caret');
      const iv = setInterval(() => { el.textContent = txt.slice(0, ++c); if (c >= txt.length) { clearInterval(iv); el.classList.remove('caret'); setTimeout(next, 900); } }, 28);
    })();
  }
  new IntersectionObserver((es, o) => { if (es[0].isIntersecting) { play(); o.disconnect(); } }, { threshold: .3 }).observe(chat);

  const faq = [
    ['什么是俱乐部价格？', '这是你直接获得的服务批发价，没有中间商和聚合平台的加价。优惠幅度取决于目的地、日期和服务。'],
    ['积分如何运作？', '你的投入会转化为积分：支付旅行费用时，1 积分等于 1 美元。更高级别的会员方案还会额外赠送积分。'],
    ['航班被取消了怎么办？', '给顾问发消息或打电话。支持团队全天候工作，会帮你改签机票和预订。'],
    ['可以和朋友或家人一起去吗？', '可以，一次旅行可以组织一个团队，有些团体旅行本来就是为此设计的。'],
    ['如何加入俱乐部？', '在“联系我们”页面提交申请：顾问会联系你并解答所有问题。']
  ];
  document.getElementById('faq').innerHTML = faq.map(([q, a], i) => `
    <details class="reveal group rounded-2xl bg-ocean text-pale" style="--d:${i * 60}ms">
      <summary class="flex min-h-[56px] items-center justify-between gap-4 p-5 font-semibold text-gold">${q}<svg class="chev h-5 w-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></summary>
      <p class="px-5 pb-5 text-sm">${a}</p>
    </details>`).join('');
</script>
