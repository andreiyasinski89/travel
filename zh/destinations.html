<!doctype html>
<html lang="zh">
<head>
<script src="../assets/consent.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>目的地 — 智慧旅行俱乐部</title>
<meta name="description" content="智慧旅行俱乐部目的地互动地图：海滩、城市、山脉和邮轮。">
<link rel="canonical" href="https://clever-travel.club/zh/destinations.html">
<link rel="alternate" hreflang="ru" href="https://clever-travel.club/destinations.html">
<link rel="alternate" hreflang="en" href="https://clever-travel.club/en/destinations.html">

<link rel="alternate" hreflang="zh" href="https://clever-travel.club/zh/destinations.html">
<link rel="alternate" hreflang="hi" href="https://clever-travel.club/hi/destinations.html">
<link rel="alternate" hreflang="x-default" href="https://clever-travel.club/destinations.html">
<link rel="icon" type="image/svg+xml" href="../assets/favicon.svg?v=2">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png?v=2">
<link rel="shortcut icon" href="../favicon.ico?v=2">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/tw.js"></script>
<link rel="stylesheet" href="../assets/site.css">
</head>
<body class="antialiased">
<div id="site-header"></div>
<main>

<section class="relative overflow-hidden bg-teal-grad px-4 pb-14 pt-36 sm:px-6">
  <div class="pointer-events-none absolute inset-0" aria-hidden="true">
    <div class="a-cloud h-12 w-32" style="top:20%;--t:60s;--dl:-5s"><span data-art="cloud"></span></div>
    <div class="a-plane h-8 w-20" style="top:48%;--t:28s"><span data-art="plane"></span></div>
  </div>
  <div class="relative mx-auto max-w-6xl">
    <p class="reveal text-sm font-semibold uppercase tracking-widest text-ocean">目的地</p>
    <h1 class="reveal mt-4 max-w-3xl text-3xl font-bold leading-tight text-ocean sm:text-5xl" style="--d:80ms">这次飞去哪里？</h1>
    <p class="reveal mt-6 max-w-2xl text-lg text-ink" style="--d:160ms">在地图上选择一个点或度假类型。这些只是示例目的地，俱乐部的目录涵盖全球。</p>
  </div>
</section>

<!-- MAP -->
<section class="bg-ocean-grad px-4 pb-20 pt-10 sm:px-6">
  <div class="mx-auto max-w-6xl">
    <div class="flex flex-wrap gap-2" role="group" aria-label="按度假类型筛选" id="filters"></div>
    <div class="relative mt-6 overflow-hidden rounded-3xl bg-deep shadow-soft ring-1 ring-pale/20">
      <svg id="map" viewBox="0 0 1000 500" class="block h-auto w-full" role="img" aria-label="带目的地的世界地图">
        <defs><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#BAE6FD" stroke-opacity=".08"/></pattern></defs>
        <rect width="1000" height="500" fill="url(#grid)"/>
        <g id="land" fill="#10B981" fill-opacity=".55" stroke="#A6F0C4" stroke-opacity=".7" stroke-width="1.5" stroke-linejoin="round"></g>
        <g id="pins"></g>
      </svg>
      <div id="infoCard" class="absolute bottom-3 left-3 right-3 rounded-2xl bg-gold p-4 text-ocean shadow-gold sm:right-auto sm:max-w-sm" role="status"></div>
    </div>
  </div>
</section>

<!-- CARDS -->
<section class="bg-sunset px-4 py-20 sm:px-6 lg:py-28">
  <div class="mx-auto max-w-6xl">
    <h2 class="reveal text-2xl font-bold text-ocean sm:text-4xl">下一条路线的灵感</h2>
    <div class="mt-10 grid gap-5 sm:grid-cols-2 lg:grid-cols-3" id="cards"></div>
  </div>
</section>

<section class="bg-azure-grad px-4 py-20 text-center sm:px-6">
  <h2 class="reveal text-2xl font-bold text-ocean sm:text-4xl">需要特别定制吗？</h2>
  <p class="reveal mt-4 text-ink" style="--d:80ms">告诉顾问你想要什么，他会为你定制专属路线。</p>
  <a href="contacts.html" class="reveal mt-8 inline-flex min-h-[52px] items-center rounded-full bg-gold px-10 py-3 font-semibold text-ocean shadow-gold transition hover:-translate-y-0.5 hover:bg-gold-dark" style="--d:160ms">联系顾问</a>
</section>
</main>
<div id="site-footer"></div>

<script>
  /* simple stylized map: continent outlines in lon/lat coordinates */
  const P = ([lo, la]) => [(lo + 180) / 360 * 1000, (90 - la) / 180 * 500];
  const land = {
    na: [[-168,66],[-140,70],[-95,72],[-80,70],[-62,60],[-55,50],[-67,44],[-76,35],[-81,25],[-97,26],[-97,18],[-87,21],[-83,10],[-78,8],[-92,15],[-105,22],[-117,32],[-124,40],[-125,49],[-140,59],[-153,58],[-165,60]],
    gl: [[-55,60],[-45,60],[-20,70],[-25,82],[-60,82],[-72,76]],
    sa: [[-78,8],[-62,11],[-50,2],[-35,-6],[-39,-20],[-48,-27],[-58,-38],[-65,-42],[-68,-55],[-74,-50],[-72,-30],[-70,-18],[-81,-5]],
    eu: [[-10,36],[-9,43],[-2,47],[-5,50],[5,53],[8,57],[5,62],[15,69],[28,71],[40,67],[40,56],[30,46],[28,41],[23,37],[12,38],[3,43],[-6,36]],
    af: [[-17,21],[-10,30],[-5,36],[10,37],[32,31],[35,28],[43,12],[51,12],[40,-3],[40,-15],[33,-26],[20,-35],[14,-22],[12,-5],[9,4],[-8,4],[-17,14]],
    as: [[36,36],[35,28],[43,13],[55,17],[58,24],[67,25],[73,18],[78,8],[80,15],[90,22],[98,16],[100,5],[104,1],[109,12],[108,21],[122,30],[122,40],[130,42],[142,52],[160,60],[178,65],[170,68],[140,73],[100,77],[60,70],[40,67],[40,56],[30,46],[28,41]],
    au: [[114,-22],[122,-18],[131,-12],[142,-11],[146,-19],[153,-27],[150,-37],[140,-38],[130,-32],[115,-34]]
  };
  document.getElementById('land').innerHTML = Object.values(land).map(pts => `<polygon points="${pts.map(p => P(p).map(n => n.toFixed(1)).join(',')).join(' ')}"/>`).join('');

  const dest = [
    ['里斯本', 'city', [-9, 39], '温暖的海滨之城：有轨电车、滨水步道和欧洲最好的烘焙糕点。'],
    ['迪拜', 'city', [55, 25], '摩天大楼、沙漠和海滩，一次旅行全拥有。'],
    ['巴厘岛', 'beach', [115, -8], '梯田、冲浪和宁静的静修。'],
    ['东京', 'city', [139, 36], '对比鲜明的城市：从高科技到古老寺庙。'],
    ['罗马', 'city', [12, 42], '永恒之城：处处是历史。'],
    ['马尔代夫', 'beach', [73, 4], '碧绿的潟湖和水上别墅。'],
    ['纽约', 'city', [-74, 41], '不夜之城：博物馆、演出和美食。'],
    ['伊斯坦布尔', 'city', [29, 41], '连接两大洲的桥梁与丰富的美食。'],
    ['开普敦', 'mount', [18, -34], '桌山、大洋和葡萄酒谷。'],
    ['里约热内卢', 'beach', [-43, -23], '狂欢节的节奏、海滩和俯瞰城市的山峦。'],
    ['雷克雅未克', 'mount', [-22, 64], '间歇泉、瀑布和极光。'],
    ['悉尼', 'cruise', [151, -34], '海湾、歌剧院和海上漫步。'],
    ['地中海邮轮', 'cruise', [10, 38], '一次旅行游览多个国家，无需换乘。'],
    ['加勒比海', 'cruise', [-75, 15], '温暖的海水、绿色的岛屿和沙滩。'],
    ['巴哈马', 'cruise', [-77, 25], '碧蓝的海水和数十座小岛。'],
    ['挪威峡湾', 'cruise', [5, 61], '岩石海岸、瀑布和群山之间平静的海水。'],
    ['波罗的海', 'cruise', [20, 58], '北欧古老的港口城市。'],
    ['阿拉斯加', 'cruise', [-146, 59], '冰川、山脉和北方的野生自然。'],
    ['夏威夷群岛', 'cruise', [-157, 21], '火山、瀑布和海洋沙滩。'],
    ['爱琴海', 'cruise', [25, 38], '希腊群岛和山坡上的石头村庄。'],
    ['加那利群岛', 'cruise', [-15, 28], '全年温和的气候和火山景观。'],
    ['红海', 'cruise', [38, 20], '珊瑚礁和适合游泳、潜水的温暖海水。'],
    ['尼罗河', 'cruise', [32, 26], '沿河邮轮，途经埃及古老的神庙。'],
    ['塞舌尔', 'cruise', [55, -5], '花岗岩礁石、棕榈树和平静的海洋。'],
    ['东南亚', 'cruise', [108, 8], '热带岛屿、热闹的市场和当地美食。'],
    ['日本', 'cruise', [132, 32], '港口城市、温泉和樱花季。'],
    ['大堡礁', 'cruise', [148, -17], '地球上最大的珊瑚系统，位于澳大利亚海岸外。'],
    ['新西兰', 'cruise', [174, -41], '峡湾、山脉和海边的绿色山谷。'],
    ['法属波利尼西亚', 'cruise', [-149, -17], '太平洋中的潟湖与岛屿。'],
    ['亚马孙', 'cruise', [-60, -3], '穿越世界最大热带雨林的河上邮轮。'],
    ['巴塔哥尼亚和火地岛', 'cruise', [-70, -54], '大陆的尽头：冰川、海峡和山脉。'],
    ['南极洲', 'cruise', [-60, -66], '冰山、企鹅和极地风光。']
  ];
  const typeName = { all: '全部', beach: '海滩', city: '城市', mount: '山脉与自然', cruise: '邮轮' };
  const typeBg = { beach: 'bg-azure-grad', city: 'bg-gold-grad', mount: 'bg-mint-grad', cruise: 'bg-teal-grad' };
  const art = { beach: 'balloon', city: 'plane', mount: 'balloon', cruise: 'ship' };
  let filter = 'all', selected = null;

  const pinsG = document.getElementById('pins'), info = document.getElementById('infoCard');

  function renderPins() {
    pinsG.innerHTML = dest.map((d, i) => {
      const [x, y] = P(d[2]), on = filter === 'all' || d[1] === filter, sel = selected === i;
      return `<g class="cursor-pointer" tabindex="${on ? 0 : -1}" role="button" aria-label="${d[0]}" data-i="${i}" style="opacity:${on ? 1 : .15};transition:opacity .3s">
        ${sel ? `<circle cx="${x}" cy="${y}" r="18" fill="#F5B83D" opacity=".35"><animate attributeName="r" values="8;24" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0" dur="1.6s" repeatCount="indefinite"/></circle>` : ''}
        <circle cx="${x}" cy="${y}" r="${sel ? 9 : 6.5}" fill="${sel ? '#F5B83D' : '#A6F0C4'}" stroke="#0B3C5D" stroke-width="2.5"/>
        <circle cx="${x}" cy="${y}" r="16" fill="transparent"/></g>`;
    }).join('');
  }
  function selectDest(i) {
    selected = i; const d = dest[i];
    renderPins();
    info.innerHTML = `<p class="font-display text-lg font-semibold">${d[0]}</p><p class="mt-1 text-sm">${d[3]}</p><a href="contacts.html" class="mt-3 inline-block rounded-full bg-ocean px-4 py-2 text-sm font-semibold text-gold">我想去这里</a>`;
  }
  pinsG.addEventListener('click', e => { const g = e.target.closest('[data-i]'); if (g) selectDest(+g.dataset.i); });
  pinsG.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.dataset.i) { e.preventDefault(); selectDest(+e.target.dataset.i); } });

  function renderFilters() {
    document.getElementById('filters').innerHTML = Object.entries(typeName).map(([k, v]) =>
      `<button data-f="${k}" class="min-h-[44px] rounded-full px-5 py-2 text-sm font-semibold transition ${filter === k ? 'tab-active' : 'bg-pale/20 text-pale hover:bg-pale/30'}" aria-pressed="${filter === k}">${v}</button>`).join('');
  }
  document.getElementById('filters').addEventListener('click', e => { const b = e.target.closest('[data-f]'); if (!b) return; filter = b.dataset.f; renderFilters(); renderPins(); renderCards(); });

  function renderCards() {
    document.getElementById('cards').innerHTML = dest.map((d, i) => ({ d, i })).filter(({ d }) => filter === 'all' || d[1] === filter).map(({ d, i }, n) => `
      <article class="reveal in overflow-hidden rounded-3xl bg-ocean text-pale shadow-soft transition hover:-translate-y-1.5" style="--d:${n * 50}ms">
        <div class="relative h-36 ${typeBg[d[1]]}"><div class="a-float absolute bottom-3 left-5 h-14 w-24" style="--dl:-${n}s"><span data-art="${art[d[1]]}"></span></div><span class="absolute right-4 top-4 rounded-full bg-ocean px-3 py-1 text-xs font-semibold text-gold">${typeName[d[1]]}</span></div>
        <div class="p-6"><h3 class="text-lg font-semibold text-gold">${d[0]}</h3><p class="mt-2 text-sm">${d[3]}</p><button data-show="${i}" class="mt-4 rounded-full border border-gold px-4 py-2 text-sm font-semibold text-gold transition hover:bg-gold hover:text-ocean">在地图上显示</button></div>
      </article>`).join('');
    document.querySelectorAll('#cards [data-art]').forEach(el => el.innerHTML = window.__ART ? window.__ART[el.dataset.art] : '');
  }
  document.getElementById('cards').addEventListener('click', e => { const b = e.target.closest('[data-show]'); if (!b) return; selectDest(+b.dataset.show); document.getElementById('map').scrollIntoView({ behavior: 'smooth', block: 'center' }); });

  renderFilters(); renderPins(); renderCards();
  info.innerHTML = '<p class="font-medium">点击地图上的点即可查看目的地。</p>';
</script>
<script src="../assets/site.js"></script>
<script src="../assets/presentation.js?v=1"></script>
<script>renderCards();</script>
</body>
</html>
